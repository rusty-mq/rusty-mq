# cargo-deny configuration (gate 7: license/advisory checks).
# Policy per PRD §8.2: MIT OR Apache-2.0 preferred; audited permissive
# BSD/ISC/Zlib/Unicode licenses allowed with required notices (see
# THIRD_PARTY_NOTICES.md); copyleft denied.

[graph]
all-features = true

[licenses]
version = 2
# Permissive set. Copyleft (GPL/AGPL/LGPL/SSPL) is NOT in this list and
# therefore denied by default.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",          # Mozilla 2.0 is file-level weak copyleft; ring-free tree audit each bump
  "0BSD",
  "BlueOak-1.0.0",
  "OpenSSL",           # rustls tooling on some targets; no linking in the default build
]
private = { ignore = true }  # workspace crates: MIT OR Apache-2.0 dual-licensed
confidence-threshold = 0.93

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
highlight = "all"
deny = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
