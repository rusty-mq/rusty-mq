name: interop

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Gate 2: the five-client matrix. Stages every runtime the fixtures need,
  # so a SKIP here means staging broke — fail the job in that case rather
  # than letting a client family silently drop out of the matrix.
  five-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pika==1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix /tmp/rmq-interop amqplib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Stage Java client jars (amqp-client + SLF4J binding)
        run: |
          cd /tmp/rmq-interop
          curl -sfLO https://repo1.maven.org/maven2/com/rabbitmq/amqp-client/5.21.0/amqp-client-5.21.0.jar
          curl -sfLO https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.13/slf4j-api-2.0.13.jar
          curl -sfLO https://repo1.maven.org/maven2/org/slf4j/slf4j-nop/2.0.13/slf4j-nop-2.0.13.jar
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Stage Go module (amqp091-go)
        run: |
          mkdir -p /tmp/rmq-interop/go && cd /tmp/rmq-interop/go
          go mod init fixture
          go get github.com/rabbitmq/amqp091-go@v1.10.0
      - name: Five-client matrix (lapin, pika, amqplib, amqp-client, amqp091-go)
        env:
          RMQ_JAVA_CP: /tmp/rmq-interop/slf4j-api-2.0.13.jar:/tmp/rmq-interop/slf4j-nop-2.0.13.jar
          RMQ_GO_MOD: /tmp/rmq-interop/go
          RMQ_NODE_MODULES: /tmp/rmq-interop/node_modules
        run: |
          set -o pipefail
          cargo test -p rusty-mq --test interop_matrix -- --nocapture 2>&1 | tee /tmp/interop.log
          if grep -q '^SKIP' /tmp/interop.log; then
            echo "::error::a client family skipped in CI — staging is broken"
            exit 1
          fi
