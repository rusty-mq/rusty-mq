name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug-off test builds: the first CI run died linking ~30 debug test
  # binaries in parallel (linker OOM-killed, exit 101). No debuginfo keeps
  # link memory and time bounded; -j 2 on the test build caps peak.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - name: Test (no-fail-fast; failures echoed into the public job summary)
        run: |
          set +e
          cargo test --workspace -j 2 --no-fail-fast 2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "## Test failures"
              echo '```'
              grep -B2 -A25 -E "FAILED|panicked at" /tmp/test.log | tail -300
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Check documentation builds
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: License + advisory + source checks (gate 7)
        run: |
          cargo install cargo-deny --locked
          cargo deny --version
          cargo deny check licenses advisories bans sources
