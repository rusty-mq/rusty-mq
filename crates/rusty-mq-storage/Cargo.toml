[package]
name = "rusty-mq-storage"
description = "Durable journal, snapshots, redb projection, recovery, and backup for rusty-mq (M4-M6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
argon2 = { workspace = true }
rand = { workspace = true }
redb = { workspace = true }
rusty-mq-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The single justified unsafe: kill(2) with signal 0 as a liveness probe
# (PRD §15.2: narrowly scoped exceptions require documentation). The
# workspace forbids unsafe everywhere else.
[lints]
workspace = true
