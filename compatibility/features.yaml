# Machine-readable feature/error matrix (PRD §4.4).
# status: unsupported | planned | in_progress | supported
# `planned` MUST NOT be rendered as supported anywhere.
# Every non-`supported` behavior-bearing entry carries its exact rejection.

features:
  # --- protocol core ---
  amqp_091_wire:
    status: supported
    target_release: "1.0"
    requirement: FR-P01
    tests: ["framing unit tests", "tables::tests (budgets)", "T26 fuzz_frames", "five_client_interop_matrix (all five clients)"]
  publisher_confirms:
    status: supported
    target_release: "1.0"
    requirement: FR-PUB05
    tests: ["confirms_lapin.rs (select, ordering, return-before-confirm, nack-on-reject)", "durability_lapin (T13 injected fsync failure)", "failure_safety_lapin (T14 kill/restart)"]
    notes: "positive confirms emitted after admission; durable boundary via the journal; failpoint matrix covered"
  basic_nack:
    status: supported
    target_release: "1.0"
    requirement: FR-C05
    tests: ["settlement_lapin.rs (nack single/multiple, requeue and drop paths)"]
  consumer_cancel_notify:
    status: supported
    target_release: "1.0"
    requirement: FR-Q09
    tests: ["consume_lapin.rs queue_delete_cancels_consumers"]
  connection_blocked:
    status: supported
    target_release: "1.0"
    requirement: FR-R07
    tests: ["alarms_lapin.rs blocked_notification_reaches_capable_client, memory_alarm_stops_admissions_and_notifies_blocked"]
  basic_recover_requeue_true:
    status: supported
    target_release: "1.0"
    requirement: FR-C08
    tests: ["settlement_lapin.rs (recover requeues unacked deliveries)"]
  channel_flow_noop:
    status: unsupported
    target_release: none
    rejection: "flow-ok(active=true) always; active=false does not pause deliveries (deprecated in practice; see docs/protocol-profile.md)"
    notes: "documented no-op, matches RabbitMQ behavior for years"

  # --- rejections (deferred features; behavior = reject before state change) ---
  queue_ttl:
    status: unsupported
    target_release: "1.1"
    rejection: "channel.close 540 NOT_IMPLEMENTED (x-message-ttl / x-expires argument)"
    accepted_arguments: []
  message_expiration_property:
    status: unsupported
    target_release: "1.1"
    rejection: "channel.close 540 NOT_IMPLEMENTED (basic.publish expiration property)"
  dead_letter_exchange:
    status: unsupported
    target_release: "1.1"
    rejection: "channel.close 540 NOT_IMPLEMENTED (x-dead-letter-exchange argument)"
  quorum_queue:
    status: unsupported
    target_release: "3.0"
    rejection: "channel.close 540 NOT_IMPLEMENTED (x-queue-type=quorum)"
  stream_queue:
    status: unsupported
    target_release: later research
    rejection: "channel.close 540 NOT_IMPLEMENTED (x-queue-type=stream)"
  priority_queue:
    status: unsupported
    target_release: "2.0"
    rejection: "channel.close 540 NOT_IMPLEMENTED (x-max-priority argument)"
  amqp_transactions:
    status: unsupported
    target_release: "2.0 (requires separate atomicity design)"
    rejection: "channel.close 540 NOT_IMPLEMENTED (tx.* methods)"
  publish_immediate:
    status: unsupported
    target_release: none
    rejection: "channel.close 540 NOT_IMPLEMENTED (basic.publish immediate=true)"
  basic_recover_requeue_false:
    status: unsupported
    target_release: none
    rejection: "channel.close 540 NOT_IMPLEMENTED"
  basic_recover_async:
    status: unsupported
    target_release: none
    rejection: "channel.close 540 NOT_IMPLEMENTED (obsolete method)"
  consumer_no_local:
    status: unsupported
    target_release: none
    rejection: "channel.close 540 NOT_IMPLEMENTED (basic.consume no_local=true)"
  direct_reply_to:
    status: unsupported
    target_release: none
    rejection: "channel.close 540 NOT_IMPLEMENTED (amq.rabbitmq.reply-to)"
  single_active_consumer:
    status: unsupported
    target_release: none
    rejection: "channel.close 540 NOT_IMPLEMENTED (x-single-active-consumer)"
  consumer_priority:
    status: unsupported
    target_release: "2.0"
    rejection: "channel.close 540 NOT_IMPLEMENTED (x-priority consumer argument)"
  prefetch_size:
    status: unsupported
    target_release: none
    rejection: "channel.close 540 NOT_IMPLEMENTED (basic.qos prefetch_size != 0)"
  headers_exchange:
    status: unsupported
    target_release: "2.0"
    rejection: "channel.close 503 COMMAND_INVALID / 540 (unknown exchange type)"
  exchange_to_exchange_binding:
    status: unsupported
    target_release: "2.0"
    rejection: "channel.close 540 NOT_IMPLEMENTED"
  alternate_exchange:
    status: unsupported
    target_release: "2.0"
    rejection: "channel.close 540 NOT_IMPLEMENTED (alternate-exchange argument)"
  amqp_1_0:              { status: unsupported, target_release: later research, rejection: "connection close at protocol header" }
  mqtt:                  { status: unsupported, target_release: later research, rejection: "not a listener" }
  stomp:                 { status: unsupported, target_release: later research, rejection: "not a listener" }
  federation_shovel:     { status: unsupported, target_release: none, rejection: "n/a" }

  # --- queue profile deviations (ADR-0005) ---
  durable_exclusive_queue:
    status: unsupported
    target_release: none
    rejection: "channel.close 406 PRECONDITION_FAILED (durable=true + exclusive=true rejected in V1 profile)"
  durable_auto_delete_queue:
    status: unsupported
    target_release: none
    rejection: "channel.close 406 PRECONDITION_FAILED (durable=true + auto_delete=true rejected in V1 profile)"
  shared_transient_queue:
    status: unsupported_by_default
    target_release: "1.0 (opt-in compat switch)"
    rejection: "channel.close 406 PRECONDITION_FAILED unless compatibility.allow_transient_nonexclusive_queues=true"

  # --- management surface ---
  rabbitmq_http_api:
    status: unsupported
    target_release: "1.1 (selected endpoints)"
    rejection: "404 on /api/*; native /v1/* only in V1"
